# Dünya tanımı — Faz 7 veri hattının (build_world.py) girdisi.
# Çıktı: public/data/world/<id>/ (world.json + tiles/ + provinces.geojson + features.json; bkz. CLAUDE.md "Bölge Veri Formatı").
# Kafes (WORLD.lattice), karo boyu ve orijin sözleşmedir (src/config.ts → WORLD, tools/worldlib.py); burada tanımlanmaz.
worlds:
  bati-karadeniz:
    name: 'Batı Karadeniz'
    # Hedef iller tools/groups/<grup>.yaml dosyalarındadır (Faz 12.0b; biçim: tools/worldconfig.py, docs/faz-12-paralel-plan.md
    # §3.2): `groups` birleştirme sırasını verir. Çekirdek = Faz 12 öncesi 9 il; bati/dogu/guney Faz 12 gruplarıdır.
    groups: [cekirdek, bati, dogu, guney]
    # Komşu iller: oyuncunun yürüyebildiği ama hedef olmayan iller (inRegion=false). 'auto' = ızgara + pay ile kesişen
    # (alanı `neighbor_min_area_km2` üstündeki) tüm iller; açık liste de verilebilir (örn. [Kastamonu, Çankırı]).
    neighbors: auto
    neighbor_min_area_km2: 1
    # Sınır kutusu elle yazılmaz: hedef illerden türetilir (kırpılmış il sınırları + `margin_m` paylı kafes ızgarasının
    # enlem/boylam zarfı; DEM karolarını ve Overture indirmelerini seçer). `bbox_max` üst sınır kutusudur
    # [boylam_min, enlem_min, boylam_max, enlem_max] (derece): türetilen kutu bunun içinde kalmalıdır, aksi hâlde hata.
    # Boylam sınırı EPSG:32636'nın (orta meridyen 33°D) güvenli aralığıdır: orta meridyenden ≤ 4,5° (28,5–37,5°D; ölçek
    # sapması ≤ %0,2; docs/faz-7-paralel-plan.md §1.3). Enlem: Ankara'nın güneyi (38,6°K) ile Sinop'un kuzeyi (42,1°K).
    # Faz 12 gruplarının hepsi bunun içindedir (Samsun 37,17°D'ye, Amasya 36,5°D'ye uzanır). Aşmak bilinçli karardır.
    bbox_max: [28.50, 38.50, 37.50, 42.30]
    # Hedef illerin UTM sınır kutusuna eklenen pay (metre).
    margin_m: 2000
    # Izgara hücre boyu (gerçek metre); kafesle (WORLD) aynı olmalı (100).
    cell_size: 100
