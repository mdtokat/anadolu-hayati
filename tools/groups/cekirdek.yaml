# Grup: çekirdek — Faz 12 öncesi dünyanın 9 hedef ili (Zonguldak … Sinop, Sakarya). Veri hattının il listesi, üslupları,
# görünen adları ve simge yapıları grup parçalarından birleştirilir (tools/groups.py; biçim: docs/faz-12-paralel-plan.md §3.2).
# Bu dosya değişmez: yeni iller kendi grup dosyalarına (bati, dogu, guney) yazılır.
#
# `provinces`: geoBoundaries TUR ADM1 `shapeName`, Türkçe karakterlerle aynen. Akış dizisi olmalıdır
# (testler diziyi doğrudan okur: tests/helpers/groups.ts).
provinces: [Zonguldak, Bartın, Karabük, Düzce, Bolu, Kastamonu, Çankırı, Sinop, Sakarya]
# Görünen ad (Overture adı → oyunda gösterilen ad).
display_names: { Ereğli: Karadeniz Ereğli }
# Yerleşim üslubu (oyunda arketip ağırlıklarını seçer, `src/config.ts` → `SETTLEMENT_STYLES`).
# Listede olmayan il/ilçe merkezi `kasaba`, köy `koy` olur.
styles:
  Zonguldak: maden
  Kozlu: maden
  Kilimli: maden
  Ereğli: sanayi
  Karabük: sanayi
  Safranbolu: osmanli
  Amasra: osmanli
  Bartın: osmanli
  Mudurnu: osmanli
  Göynük: osmanli
  Kastamonu: osmanli
  Tosya: osmanli
  İnebolu: osmanli
  Çankırı: osmanli
  Sinop: osmanli
  Boyabat: osmanli
# İl kapsamını bir kutuyla sınırlama (isteğe bağlı): {İl: [boylam_min, enlem_min, boylam_max, enlem_max]}. Yalnızca
# **ızgara kapsamı** (extent) hesabında il çokgeni bu kutuya kırpılır (örn. büyük bir ilin yalnız bir kısmı); il
# sınırı ve inRegion işareti tam kalır. Çekirdekte kullanılmaz.
clip_bbox: {}
# Cami sığmayan kıyı/sıkışık merkezler (bilinçli istisna; tests/settlementMap.test.ts). Akış dizisi.
no_mosque_towns: [Amasra, Kurucaşile, İnebolu, Abana, Bozkurt, Doğanyurt, Çatalzeytin, Türkeli]
# Elle seçilmiş simge yapılar. Konumlar Overture Places kayıtlarından alınmıştır (yaklaşık; oyunda en yakın boş
# parsele oturur). `kind`: src/settlements/kinds.ts `LANDMARK_KINDS`. Yalnızca konumundan emin olunanlar listelenir.
# `settlement`: yerleşimin görünen adı (il/ilçe merkezi).
