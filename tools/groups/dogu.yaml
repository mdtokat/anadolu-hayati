# Grup: dogu — Faz 12 (Doğu: Samsun, Çorum, Amasya). Veri hattının il listesi, üslupları, görünen adları ve simge yapıları grup
# parçalarından birleştirilir (tools/groups.py; biçim: docs/faz-12-paralel-plan.md §3.2). Bu dosya yalnızca ilgili
# grubun oturumu tarafından doldurulur (plan §2.2). Boş grup (`provinces: []`) geçerlidir ve hiçbir şeyi değiştirmez.
#
# `provinces`: geoBoundaries TUR ADM1 `shapeName`, Türkçe karakterlerle aynen; akış dizisi olmalıdır.
provinces: [Samsun, Çorum, Amasya]
display_names: {}
# Yerleşim üslubu (liste dışı il/ilçe merkezi `kasaba`, köy `koy`). Tarihî Osmanlı dokusu: Amasya (Yalıboyu), Merzifon (Kara Mustafa
# Paşa Külliyesi, Bedesten), Osmancık, İskilip, Vezirköprü (Köprülü). Çorum, Samsun ve diğer ilçeler kasaba.
styles:
  Amasya: osmanli
  Merzifon: osmanli
  Osmancık: osmanli
  İskilip: osmanli
  Vezirköprü: osmanli
# İl kapsamını bir kutuyla sınırlama: bu grupta kullanılmaz (üç il de tam).
clip_bbox: {}
# Cami sığmayan kıyı/sıkışık merkezler (bilinçli istisna; tests/settlementMap.test.ts). Akış dizisi.
no_mosque_towns: []
# Simge yapılar: konumlar Overture Places kayıtlarından (yaklaşık; oyunda en yakın boş parsele oturur); yalnızca konumundan emin olunanlar
# listelenir. Hattuşa Places'te yoktur: bilinen koordinatla yazıldı (raporda belirtildi).
landmarks:
  # Amasya (il merkezi; Yalıboyu Evleri ve Hazeranlar Konağı için uygun simge türü yok: LANDMARK_KINDS). II. Bayezid Camii ile Gökmedrese
  # Camii il merkezinde parsel bulamadığı için çıkarıldı (ilçe → il düzen sırası; raporda).
  - { settlement: Amasya, kind: castle, name: Amasya Kalesi, lon: 35.826886, lat: 40.655485 }
  - {
      settlement: Amasya,
      kind: clock_tower,
      name: Amasya Saat Kulesi,
      lon: 35.833564,
      lat: 40.65228,
    }
