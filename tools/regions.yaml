# Bölge tanımları — veri hattının (tools/) girdisi.
# Her bölge public/data/regions/<id>/ altına işlenir (bkz. CLAUDE.md "Bölge Veri Formatı").
regions:
  zonguldak-bartin-karabuk:
    name: "Zonguldak – Bartın – Karabük"
    # geoBoundaries TUR ADM1 `shapeName` değerleri (Türkçe karakterlerle, aynen)
    provinces: [Zonguldak, Bartın, Karabük]
    # Oyuncunun yürüyebileceği ama bölgeye dahil olmayan komşu iller (HUD'da adları görünür,
    # provinces.geojson'da inRegion=false).
    neighbors: [Bolu, Düzce, Kastamonu, Çankırı]
    # Sınır kutusu [boylam_min, enlem_min, boylam_max, enlem_max] (derece).
    # DEM karolarını seçmek ve ızgaranın kutu içinde kaldığını doğrulamak için kullanılır.
    bbox: [31.20, 40.75, 33.25, 41.95]
    # İllerin UTM sınır kutusuna eklenen pay (metre): sınırlar harita kenarına yapışmasın.
    margin_m: 2000
    # Hedef ızgara hücre boyu (gerçek metre).
    cell_size: 100
