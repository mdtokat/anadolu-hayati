# Yerleşim tanımı — Faz 10 veri hattının (build_settlements.py) girdisi.
# Çıktı: public/data/world/<id>/settlements.json (yerleşimler, yollar, simge yapılar; bkz. CLAUDE.md "Yerleşim verisi").
# Ham girdi: fetch_settlements.py (Overture divisions/transportation/places/buildings).
worlds:
  bati-karadeniz:
    # Yerleşim çizilen iller (provinces.geojson `inRegion=true` illerinin tamamı). Komşu illere yerleşim konmaz.
    provinces: [Zonguldak, Bartın, Karabük, Düzce, Bolu, Kastamonu, Çankırı]
    # Köylerin ne kadarı çizilir (Overture `locality/village`): Batı Karadeniz köyleri dağınıktır; hepsi çizilirse
    # harita evle dolar. Seçim köy kimliğinin karmasıyla deterministiktir.
    village_fraction: 0.2
    # Köyün çizilmesi için yarıçapı içinde en az bu kadar gerçek bina olmalı (boş köy noktaları elenir).
    village_min_buildings: 8
    # Yerleşim ayak izi yarıçapı (gerçek m): bina hücreleri bu yarıçap içinde ve en yakın merkeze atanır.
    radius_m: { il: 3500, ilce: 2200, koy: 600 }
    # Bir 100 m hücrenin ayak izine girmesi için en az gerçek bina sayısı.
    min_cell_buildings: { il: 3, ilce: 3, koy: 1 }
    # Yerleşim üslubu (oyunda arketip ağırlıklarını seçer, `src/config.ts` → `SETTLEMENT_STYLES`).
    # Listede olmayan il/ilçe merkezi `kasaba`, köy `koy` olur.
    # Görünen ad (Overture adı → oyunda gösterilen ad).
    display_names: { Ereğli: Karadeniz Ereğli }
    styles:
      Zonguldak: maden
      Kozlu: maden
      Kilimli: maden
      Ereğli: sanayi
      Karabük: sanayi
      Safranbolu: osmanli
      Amasra: osmanli
      Bartın: osmanli
      Mudurnu: osmanli
      Göynük: osmanli
      Kastamonu: osmanli
      Tosya: osmanli
      İnebolu: osmanli
      Çankırı: osmanli
    # Elle seçilmiş simge yapılar. Konumlar Overture Places kayıtlarından alınmıştır (yaklaşık; oyunda en yakın boş
    # parsele oturur). `kind`: src/settlements/kinds.ts `LANDMARK_KINDS`. Yalnızca konumundan emin olunanlar listelenir.
    landmarks:
      # Zonguldak
      - {
          settlement: Zonguldak,
          kind: mosque_grand,
          name: Ulu Cami,
          lon: 31.789076,
          lat: 41.453286,
        }
      - {
          settlement: Zonguldak,
          kind: monument,
          name: Uzun Mehmet Anıtı,
          lon: 31.762907,
          lat: 41.454921,
        }
      - {
          settlement: Zonguldak,
