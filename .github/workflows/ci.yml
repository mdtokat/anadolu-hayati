name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # `npm run check` ile aynı adımlar; ayrı adımlar hangi denetimin kırıldığını görünür kılar.
    # main'de yeşil biten bu iş akışı GitHub Pages yayınını tetikler (pages.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Bütçe (chunk boyutları, açılış yükü, tahmini ilk yükleme) ve yayın bütünlüğü
      # (base yolları, public/ kopyası, karo sha256); rapor job özetinde görünür.
      - name: Derleme denetimi
        run: npm run build:check

      # Derlenen oyun indirilip yerelde denenebilsin (elle doğrulama): `npx vite preview` ya da
      # herhangi bir statik sunucuyla `/anadolu-hayati/` altında.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  tools:
    # Veri hattının saf yardımcıları (tools/worldlib.py vb.) için Python testleri.
    # Veri indirme/işleme burada çalışmaz (yüzlerce MB); yalnızca birim testler.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt
      - run: python -m pytest tools/tests -q
